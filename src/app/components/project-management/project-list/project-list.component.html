<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">
                        <input type="text" (keyup)="onKeyUp($event)" class="form-control d-inline-block col-md-4 mr-2"
                            id="exampleInputEmail1" placeholder="Search">
                        <button rippleEffect [routerLink]="['/project-management/add']"
                        *ngIf="checkpermission(4,'add')"
                            class="btn btn-primary ml-1 mb-2 float-right">Add</button>
                    </h4>
                    <div class="table-responsive mb-2">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>S.No</th>
                                    <th>Project Name</th>
                                    <th>Project Type</th>
                                    <th>Delivery Date</th>
                                    <th>Project Percentage</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of projectList?.docs let i=index">
                                    <td>{{(page-1)*10+i+1}}</td>
                                    <td>{{item?.projectName}}</td>
                                    <td> {{item?.projectType}} </td>
                                    <td> Feb 1, 2023</td>
                                    <td> 50% </td>
                                    <td>
                                        <label *ngIf="item?.status==1" class="badge badge-success">Active</label>
                                        <label *ngIf="item?.status==0" class="badge badge-danger">Inactive</label>
                                    </td>
                                    <td class="overflow-hidden">
                                        <div container="body" ngbDropdown class="d-inline-block">
                                            <button type="button" class="btn btn-flat-primary waves-effect waves-light"
                                                id="dropdownBasic2" ngbDropdownToggle>
                                                <i class="feather icon-more-vertical"></i>
                                            </button>
                                            <div ngbDropdownMenu aria-labelledby="dropdownBasic2">
                                                <a ngbDropdownItem href="javascript:void(0);"
                                                    routerLink="/project-management/view/343434"
                                                    *ngIf="checkpermission(4,'view')">
                                                    <i class="feather icon-eye mr-50"></i><span>View</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);"
                                                    routerLink="/project-management/edit/343434"
                                                    *ngIf="checkpermission(4,'edit')">
                                                    <i class="feather icon-edit mr-50"></i><span>Edit</span>
                                                </a>
                                                <a *ngIf="item?.status!=1" ngbDropdownItem
                                                    (click)="activateDeactivateProjects_f(item,'active')">
                                                    <i class="feather icon-toggle-right mr-50"></i><span>Activate</span>
                                                </a>
                                                <a *ngIf="item?.status!=0" ngbDropdownItem
                                                    (click)="activateDeactivateProjects_f(item,'deactive')">
                                                    <i class="feather icon-toggle-left mr-50"></i>
                                                    <span>Deactivate</span>
                                                </a>
                                                <a ngbDropdownItem (click)="deleteProject_f(item)" 
                                                *ngIf="checkpermission(4,'delete')">
                                                    <i class="feather icon-trash mr-50"></i> <span>Delete</span>
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr *ngIf="projectListLength.length==0 || !projectList && apiCalled">
                                    <td class="noData text-center" colspan="10">No Records found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-end">
                        <ngb-pagination *ngIf="projectListLength.length!=0 && apiCalled"
                            [collectionSize]="projectList.total" [(page)]="page" [maxSize]="10" [rotate]="true"
                            [boundaryLinks]="true" (pageChange)="refreshList(page,'')">
                        </ngb-pagination>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
