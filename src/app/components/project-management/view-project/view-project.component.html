<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="row flex-grow">
                <div class="col-12 stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">View Project</h4>
                            <form class="forms-sample" (ngSubmit)="f.form.valid" #f="ngForm" novalidate>
                                <div class="form-group row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>Project Type</label>
                                            <ng-select name="projectType" [(ngModel)]="addProject.projectType"
                                                #projectType="ngModel" disabled>
                                                <ng-container>
                                                    <ng-option value="hourly"> Hourly </ng-option>
                                                    <ng-option value="project_monthly"> Project on Monthly </ng-option>
                                                    <ng-option value="resource_monthly"> Resource on Monthly
                                                    </ng-option>
                                                    <ng-option value="fixed"> Fixed </ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>Project Name</label>
                                            <input type="text" class="form-control"
                                                pattern="[a-zA-Z0-9 ]*" name="projectName"
                                                [(ngModel)]="addProject.projectName" #projectName="ngModel"
                                                minlength="2" maxlength="60" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>Amount</label>
                                            <input type="text" class="form-control"
                                                pattern="^[0-9]*$" name="amount" [(ngModel)]="addProject.amount"
                                                #amount="ngModel" minlength="2" maxlength="60" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Currency</label>
                                            <ng-select name="currency" [(ngModel)]="addProject.currency"
                                                #currency="ngModel" placeholder="Select Currency" disabled>
                                                <ng-container>
                                                    <ng-option value="Dollar">$ - Dollar</ng-option>
                                                    <ng-option value="Euro">€ - Euro</ng-option>
                                                    <ng-option value="Pound">£ - Pound</ng-option>
                                                    <ng-option value="Yuan">¥ - Yuan</ng-option>
                                                    <ng-option value="Rupee"> ₹ - Rupee</ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Timeline </label>
                                            <ng-select name="timeline" [(ngModel)]="addProject.timeline"
                                                #timeline="ngModel" placeholder="Select timeline" disabled>
                                                <ng-container>
                                                    <ng-option value="weeks">Weeks</ng-option>
                                                    <ng-option value="months">Months</ng-option>
                                                    <ng-option value="year">Year</ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label> Delivery Date</label>
                                            <ng2-flatpickr [config]="dateOptions" name="deliveryDate"
                                                [(ngModel)]="addProject.deliveryDate" #deliveryDate="ngModel" disabled>
                                            </ng2-flatpickr>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label> Project Percentage </label>
                                            <input class="form-control" type="number" maxlength="3"
                                            min="0" max="100" pattern="^$|^([0-9]|[1-9][0-9]|[1][0][0])?" name="projectPercentage"
                                                [(ngModel)]="addProject.projectPercentage" #projectPercentage="ngModel" 
                                               disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="progress progress-bar-primary progress-xl">
                                            <div class="progress-bar progress-bar-striped" role="progressbar" 
                                                style="width:70%"></div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
