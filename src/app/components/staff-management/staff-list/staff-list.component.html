<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">
                        <input type="text" (keyup)="onKeyUp($event)" class="form-control d-inline-block col-md-4 mr-2" id="exampleInputEmail1"
                            placeholder="Search by name">
                        <button rippleEffect [routerLink]="['/staff-management/add']"
                            routerLinkActive="router-link-active"
                            class="btn btn-primary ml-1 mb-2 float-right">Add</button>
                    </h4>
                    <div class="table-responsive mb-2">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>S.No</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Created</th>
                                    <!-- <th>Type</th> -->
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!--<tr>-->
                                <tr *ngFor="let item of staffList.docs let i=index">
                                    <td>{{(page-1)*10+i+1}}</td>
                                    <td>{{item?.name}}</td>
                                    <td>{{item?.email}}</td>
                                    <td> {{item?.role?.name}}</td>
                                    <td> {{item?.createdAt | date}} </td>
                                    <td>
                                        <label *ngIf="item?.status==1" class="badge badge-success">Active</label>
                                         <label *ngIf="item?.status==0" class="badge badge-danger">Inactive</label> 
                                    </td>
                                    <td class="overflow-hidden">
                                        <div container="body" ngbDropdown placement="bottom-right"
                                            class="d-inline-block">
                                            <button type="button" class="btn btn-flat-primary waves-effect waves-light"
                                                id="dropdownBasic2" ngbDropdownToggle>
                                                <i class="feather icon-more-vertical"></i>
                                            </button>
                                            <div ngbDropdownMenu aria-labelledby="dropdownBasic2">
                                                <a ngbDropdownItem href="javascript:void(0);"
                                                    routerLink="/staff-management/view/{{item.id}}"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-eye mr-50"></i><span>View</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);"
                                                    routerLink="/staff-management/edit/{{item.id}}"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-edit mr-50"></i><span>Edit</span>
                                                </a>
                                                <a *ngIf="item?.status!=1" ngbDropdownItem (click)="activateDeactivatestaff_f(item,'active')">
                                                    <i class="feather icon-toggle-right mr-50"></i><span>Activate</span>
                                                </a>
                                                <a *ngIf="item?.status!=0" ngbDropdownItem (click)="activateDeactivatestaff_f(item,'deactive')">
                                                    <i class="feather icon-toggle-left mr-50"></i> <span>Deactivate</span>
                                                </a>
                                                <a ngbDropdownItem type="button" (click)="deleteStaff_f(item)">
                                                    <i class="feather icon-trash mr-50"></i> <span>Delete</span>
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr *ngIf="staffListLength.length==0 && apiCalled">
                      <td class="noData text-center" colspan="10">No Records found</td>
                    </tr> 
                            </tbody>
                        </table>
                    </div>
                     <div class="d-flex justify-content-end"> 
                     <ngb-pagination *ngIf="staffListLength.length!=0 && apiCalled" [collectionSize]="staffList.total"
                [(page)]="page" [maxSize]="10" [rotate]="true" [boundaryLinks]="true" (pageChange)="refreshList(page,'')">
              </ngb-pagination> 
                     </div> 
                </div>
            </div>
        </div>
    </div>
</div>
