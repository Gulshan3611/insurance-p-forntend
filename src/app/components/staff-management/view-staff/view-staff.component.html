<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="row flex-grow">
                <div class="col-12 stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">View Staff
                                <a href="#" routerLink='/staff-management/list' routerLinkActive="router-link-active" type="button"
                                class="btn btn-primary float-right">Back</a>
                            </h4>
                            <form class="forms-sample" (ngSubmit)="f.form.valid" #f="ngForm" novalidate>
                                <div class="form-group row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Name*</label>
                                            <input type="text" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Name" pattern="[a-zA-Z0-9 ]*" name="name"
                                                [(ngModel)]="staffForm.name" #name="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Phone*</label>
                                            <input type="text"
                                                pattern="^(?:(?:\+|0{0,2})91(\s*[\-]\s*)?|[0]?)?[6789]\d{9}$"
                                                maxlength="10" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Phone Number" name="phone"
                                                [(ngModel)]="staffForm.phone" #phone="ngModel" disabled>

                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Email*</label>
                                            <input type="text" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Email"
                                                pattern="[a-zA-Z0-9]+[a-zA-Z0-9._]+@[a-zA-Z]+\.[a-zzA-Z.]{2,5}$"
                                                maxlength="180" name="email" [(ngModel)]="staffForm.email"
                                                #email="ngModel" disabled>
                                        </div>
                                    </div>
                                   <!-- <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Password*</label>
                                            <input type="text" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Password" name="password"
                                                [(ngModel)]="staffForm.password" #password="ngModel" disabled>
                                        </div>
                                    </div>-->
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Role*</label>
                                            <ng-select name="role" [(ngModel)]="staffForm.role.name" #role="ngModel"
                                                disabled>
                                                <ng-container>
                                                    <ng-option value="staffForm.role.name" selected>Select Role</ng-option>
                                                  
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Contact Person Name*</label>
                                            <input type="text" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Name" pattern="[a-zA-Z0-9 ]*"
                                                name="contactPersonName" [(ngModel)]="staffForm.contactPersonName"
                                                #contactPersonName="ngModel" minlength="2" maxlength="60" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Contact Person Number*</label>
                                            <input type="text"
                                                pattern="^(?:(?:\+|0{0,2})91(\s*[\-]\s*)?|[0]?)?[6789]\d{9}$"
                                                maxlength="10" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Phone Number" name="contactPersonNumber"
                                                [(ngModel)]="staffForm.contactPersonNumber"
                                                #contactPersonNumber="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Contact Person Email*</label>
                                            <input type="text" class="form-control" id="exampleInputName1"
                                                placeholder="Enter Email"
                                                pattern="[a-zA-Z0-9]+[a-zA-Z0-9._]+@[a-zA-Z]+\.[a-zzA-Z.]{2,5}$"
                                                maxlength="180" name="contactPersonEmail"
                                                [(ngModel)]="staffForm.email" #contactPersonEmail="ngModel"
                                                disabled>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <label for="exampleInputName1" class="col-sm-2 col-form-label">Address</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control"
                                            (keydown.enter)="$event.preventDefault()" placeholder="Address"
                                            name="address" #address="ngModel" [(ngModel)]="staffForm.address"
                                            autocorrect="off" autocapitalize="off" spellcheck="off" type="text" #search
                                            disabled>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label for="exampleInputName1" class="col-sm-2 col-form-label"
                                        style="visibility: hidden;">Address</label>
                                    <div class="col-sm-3">
                                        <!-- <input type="text" class="form-control" id="exampleInputName1"
                                            placeholder="Country" name="country" #country="ngModel"
                                            [(ngModel)]="staffForm.country" #fax="ngModel" disabled> -->

                                            <ng-select name="country" [(ngModel)]="staffForm.country" #country="ngModel"
                                            placeholder="Select Country" disabled>
                                            <ng-container *ngFor="let country of countries" [value]="country | json">
                                                <ng-option value="{{ country.isoCode}}">{{ country.name }}</ng-option>
                                            </ng-container>
                                        </ng-select>
                                    </div>
                                    <div class="col-sm-3">
                                        <!-- <input type="text" class="form-control" id="exampleInputName1"
                                            placeholder="State" name="state" #state="ngModel"
                                            [(ngModel)]="staffForm.state" #fax="ngModel" disabled> -->

                                            <ng-select name="state" [(ngModel)]="staffForm.state" #state="ngModel"
                                            placeholder="Select State" disabled>
                                            <ng-container *ngFor="let state of states" [value]="state | json">
                                                <ng-option value="{{ state.name }}">{{ state.name }} 
                                                </ng-option>
                                            </ng-container>
                                        </ng-select>
                                    </div>
                                    <div class="col-sm-2">
                                        <input type="text" class="form-control" id="exampleInputName1"
                                            placeholder="City" name="city" #city="ngModel" [(ngModel)]="staffForm.city"
                                            #fax="ngModel" disabled>
                                    </div>
                                    <div class="col-sm-2">
                                        <input type="text" class="form-control" id="exampleInputName1" placeholder="Zip"
                                            name="zipcode" #zipcode="ngModel" [(ngModel)]="staffForm.zipcode"
                                            #fax="ngModel" disabled>
                                    </div>
                                </div>
                               <!-- <div class="form-group row">
                                    <label for="exampleInputName1" class="col-sm-2 col-form-label">Status</label>
                                    <div class="col-sm-10">
                                         <select class="form-control" id="exampleInputName1" name="status"
                                    [(ngModel)]="staffForm.status" #status="ngModel" disabled>
                                    <option value="" disabled>Select Status</option>
                                    <option value="1">Active</option>
                                    <option value="0">In-Active</option>
                                </select> 

                                        <ng-select name="status" [(ngModel)]="staffForm.status" #status="ngModel"
                                            placeholder="Select Country" disabled>
                                            <ng-container>
                                                <ng-option value="" disabled>Select Status</ng-option>
                                                <ng-option value="1">Active</ng-option>
                                                <ng-option value="0">In-Active </ng-option>
                                            </ng-container>
                                        </ng-select>
                                    </div>
                                </div>-->
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
