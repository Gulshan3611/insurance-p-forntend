<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">
                        <input type="text" (keyup)="onKeyUp($event)" class="form-control d-inline-block col-md-4" id="exampleInputEmail1"
                            placeholder="Search by name">
                        <button type="button" routerLink="/resource-management/add" routerLinkActive="router-link-active"
                            class="btn btn-primary ml-1 float-right" rippleEffect>Add New Resource</button>
                    </h4>
                    <div class="table-responsive mb-2">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>S.No</th>
                                    <th>Name</th>
                                    <th>Designation</th>
                                    <th>Technology</th>
                                    <th>Profile Photo</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- <tr *ngFor="let item of roleList.docs let i=index"> -->
                                <tr *ngFor="let item of roleList.docs let i=index">
                                    <td>{{(page-1)*10+i+1}}</td>
                                    <td>{{item?.name}}</td>
                                    <td>
                                        <label *ngIf="item?.status==1" class="badge badge-success">Active</label>
                                        <label *ngIf="item?.status==0" class="badge badge-danger">Inactive</label> 
                                    </td>

                                    <td class="overflow-hidden">
                                        <div container="body" ngbDropdown placement="bottom-right" class="d-inline-block">
                                            <button type="button"
                                                class="btn btn-flat-primary waves-effect waves-light"
                                                id="dropdownBasic2" ngbDropdownToggle>
                                                <i class="feather icon-more-vertical"></i>
                                            </button>
                                            <div ngbDropdownMenu aria-labelledby="dropdownBasic2">
                                                <a ngbDropdownItem  routerLink="/resource-management/view/{{item.id}}"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-eye mr-50"></i><span>View</span>
                                                </a>
                                                <a ngbDropdownItem  routerLink="/resource-management/edit/{{item.id}}"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-edit mr-50"></i><span>Edit</span>
                                                </a>

                                                <a *ngIf="item?.status!=1" type="button"  ngbDropdownItem (click)="activateDeactivateRoles_f(item,'active')">
                                                    <i class="feather icon-toggle-right mr-50"></i><span>Activate</span>
                                                </a>
                                                <a *ngIf="item?.status!=0" type="button" ngbDropdownItem (click)="activateDeactivateRoles_f(item,'deactive')">
                                                    <i class="feather icon-toggle-left mr-50"></i> <span>Deactivate</span>
                                                </a>
                                                <a type="button" (click)="deleteRole_f(item)" ngbDropdownItem >
                                                    <i class="feather icon-trash mr-50"></i> <span>Delete</span>
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                
                                <tr *ngIf="roleListLength.length==0 && apiCalled">
                    <td class="noData text-center" colspan="10">No Records found</td>
                </tr> 
                            </tbody>
                        </table>
                    </div>
                     <ngb-pagination *ngIf="roleListLength.length!=0 && apiCalled" [collectionSize]="roleList.total"
            [(page)]="page" [maxSize]="10" [rotate]="true" [boundaryLinks]="true" (pageChange)="refreshList(page,'')">
            </ngb-pagination> 
                </div>
            </div>
        </div>
    </div>
</div>
