<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="row flex-grow">
                <div class="col-12 stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">View Resource
                                <a href="#" routerLink='/resource-management/list' routerLinkActive="router-link-active"
                                    type="button" class="btn btn-primary float-right">Back</a>
                            </h4>
                            <form class="forms-sample" (ngSubmit)="f.form.valid" #f="ngForm" novalidate>
                                <div class="form-group row">

                                    <div class="col-md-12">
                                        <div class="media">
                                            <a href="javascript:void(0);" class="mr-25">
                                                <img src="{{addResource.profilePhoto}}"
                                                    onerror="this.src='assets/images/portrait/small/not_ava.png'"
                                                    class="rounded mr-50" alt="profile image" height="76" width="80" />
                                            </a>
                                        </div>
                                    </div>

                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label> Name</label>
                                            <input type="text" class="form-control" name="name"
                                                [(ngModel)]="addResource.name" #name="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label> Technology</label>
                                            <input type="text" class="form-control" name="technology"
                                                [(ngModel)]="addResource.technology" #technology="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>Phone</label>
                                            <input type="text" class="form-control" name="phone"
                                                [(ngModel)]="addResource.phone" #phone="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>Email</label>
                                            <input type="text" class="form-control" name="email"
                                                [(ngModel)]="addResource.email" #email="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label> Designation</label>
                                            <input type="text" class="form-control" name="designation"
                                                [(ngModel)]="addResource.designation" #designation="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label> Gender</label>
                                            <input type="text" class="form-control" name="gender"
                                                [(ngModel)]="addResource.gender" #gender="ngModel" disabled>
                                        </div>
                                    </div>

                                    <div class="col-md-12">
                                        <div class="card-footer">
                                            Address
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <label for="account-name">Address </label>
                                            <textarea class="form-control" type="text" name="address"
                                                [(ngModel)]="addResource.address" #address="ngModel"
                                                disabled></textarea>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Country</label><ng-select name="country"
                                                [(ngModel)]="addResource.country" #country="ngModel"
                                                placeholder="Select Country" disabled>
                                                <ng-container *ngFor="let country of countries"
                                                    [value]="country | json">
                                                    <ng-option value="{{ country.isoCode}}">{{ country.name
                                                        }}</ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">State</label>
                                            <ng-select name="state" [(ngModel)]="addResource.state" #state="ngModel"
                                                placeholder="Select State" disabled>
                                                <ng-container *ngFor="let state of states" [value]="state | json">
                                                    <ng-option value="{{ state.name }}">{{ state.name }}
                                                    </ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">City</label>
                                            <input class="form-control" type="text" [(ngModel)]="addResource.city"
                                                #city="ngModel" placeholder="City" name="city" disabled>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
