<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="row flex-grow">
                <div class="col-12 stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">View Vendor
                                <a href="#" routerLink='/vendor-management/list' routerLinkActive="router-link-active"
                                    type="button" class="btn btn-primary float-right">Back</a>
                            </h4>
                            <form class="forms-sample" (ngSubmit)="f.form.valid" #f="ngForm" novalidate>
                                <div class="form-group row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Vendor Type</label>
                                            <ng-select name="vendorType" [(ngModel)]="addVendor.vendorType"
                                                #vendorType="ngModel" placeholder="Select Vendor Type" disabled>
                                                <ng-container>
                                                    <ng-option value="0">Individual</ng-option>
                                                    <ng-option value="1">Company</ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4" *ngIf="addVendor.vendorType == 1">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Company Name</label>
                                            <input type="text" class="form-control" id="exampleInputName1"
                                                name="companyName" [(ngModel)]="addVendor.companyName"
                                                #companyName="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Vendor Name</label>
                                            <input type="text" class="form-control" id="exampleInputName1" name="name"
                                                [(ngModel)]="addVendor.name" #name="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Vendor Phone</label>
                                            <input type="text" class="form-control" id="exampleInputName1" name="phone"
                                                [(ngModel)]="addVendor.phone" #phone="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="exampleInputName1">Vendor Email</label>
                                            <input type="text" class="form-control" id="exampleInputName1" name="email"
                                                [(ngModel)]="addVendor.email" #email="ngModel" disabled>
                                        </div>
                                    </div>

                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Currency</label>
                                            <ng-select name="currency" [(ngModel)]="addVendor.currency"
                                                #currency="ngModel" placeholder="Select Currency" disabled>
                                                <ng-container>
                                                    <ng-option value="Dollar">$ - Dollar</ng-option>
                                                    <ng-option value="Euro">€ - Euro</ng-option>
                                                    <ng-option value="Pound">£ - Pound</ng-option>
                                                    <ng-option value="Yuan">¥ - Yuan</ng-option>
                                                    <ng-option value="Rupee"> ₹ - Rupee</ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <!-- <div class="col-md-4" *ngIf="addVendor.currency == 'Rupee'">
                                        <div class="form-group">
                                            <label for="exampleInputName1">GST Number</label>
                                            <input type="text" class="form-control" id="exampleInputName1"  name="gstNumber"
                                                [(ngModel)]="addVendor.gstNumber" #gstNumber="ngModel" 
                                                disabled>
                                        </div>
                                    </div> -->
                                    <div class="col-md-12">
                                        <div class="card-footer">
                                            Address
                                        </div>
                                    </div>
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <label for="account-name">Address</label>
                                            <textarea class="form-control" type="text" pattern="[a-zA-Z0-9/-_ ]*"
                                                name="address" [(ngModel)]="addVendor.address" #address="ngModel"
                                                disabled></textarea>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Country</label>
                                            <ng-select name="country" [(ngModel)]="addVendor.country" #country="ngModel"
                                                placeholder="Select Country"
                                                disabled>
                                                <ng-container *ngFor="let country of countries"
                                                    [value]="country | json">
                                                    <ng-option value="{{ country.isoCode}}">{{ country.name
                                                        }}</ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">State</label>
                                            <ng-select name="state" [(ngModel)]="addVendor.state" #state="ngModel"
                                                placeholder="Select State" disabled>
                                                <ng-container *ngFor="let state of states" [value]="state | json">
                                                    <ng-option value="{{ state.name }}">{{ state.name }}
                                                    </ng-option>
                                                </ng-container>
                                            </ng-select>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">City</label>
                                            <input class="form-control" type="text" name="city"
                                                [(ngModel)]="addVendor.city" #city="ngModel" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="account-name">Pincode</label>
                                            <input class="form-control" type="text" name="zipcode" minlength="5"
                                                maxlength="7" [(ngModel)]="addVendor.zipcode" #zipcode="ngModel"
                                                disabled>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
