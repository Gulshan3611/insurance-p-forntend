<form class="validate-form" (ngSubmit)="(f.form.valid)" #f="ngForm" novalidate>
    <div class="row">
        <div class="col-12 col-sm-6">
            <div class="form-group">
                <label class="form-control-label" for="oldPassword">Old Password</label>
                <div class="input-group form-password-toggle input-group-merge">
                    <input [type]="passwordTextTypeOld ? 'text' : 'password'" name="password"
                        class="form-control" 
                        placeholder="Old Password" ngModel name="oldPassword"
                        [(ngModel)]="myForm.oldPassword" #oldPassword="ngModel" required minlength="8" maxlength="16"
                        id="oldPassword" />
                    <div class="input-group-append">
                        <span class="input-group-text cursor-pointer">
                            <i class="feather font-small-4" [ngClass]="{
                                'icon-eye': passwordTextTypeOld,
                                'icon-eye-off': !passwordTextTypeOld
                                }" (click)="togglePasswordTextTypeOld()"></i>
                        </span>
                    </div>
                </div>
                <div *ngIf="oldPassword.invalid && oldPassword.touched" class="form-text text-danger small">
                    <small *ngIf="oldPassword?.errors?.['required']"> Old Password is required. </small>
                    <small *ngIf="oldPassword?.errors?.['minlength']"> Please enter password between 8 and 16.</small>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-sm-6">
            <div class="form-group">
                <label class="form-control-label" for="account-new-password">Password</label>
                <div class="input-group form-password-toggle input-group-merge">
                    <input [type]="passwordTextTypeNew ? 'text' : 'password'" name="password"
                        class="form-control" 
                        placeholder="Enter password" ngModel name="password"
                        [(ngModel)]="myForm.password" #password="ngModel" required minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[$@$!%#*?&])[A-Za-z\d$@$!%#*?&].{7,}"
                        id="password" />
                    <div class="input-group-append">
                        <span class="input-group-text cursor-pointer">
                            <i class="feather font-small-4" [ngClass]="{
                                'icon-eye': passwordTextTypeNew,
                                'icon-eye-off': !passwordTextTypeNew
                                }" (click)="togglePasswordTextTypeNew()"></i>
                        </span>
                    </div>
                </div>
                <div *ngIf="password.invalid && password.touched" class="form-text text-danger small">
                    <small *ngIf="['password?.errors?.required']"> Password is required. </small>
                    <small *ngIf="['password?.errors?.pattern']">
                        Must contain at least one number and one uppercase and lowercase letter, and at
                        least 8 or
                        more characters.</small>
                </div>
            </div>
        </div>
        <div class="col-12 col-sm-6">
            <div class="form-group">
                <label class="form-control-label" for="confirmPassword">Confirm Password</label>
                <div class="input-group form-password-toggle input-group-merge">
                    <input [type]="passwordTextTypeRetype ? 'text' : 'password'" class="form-control"
                        placeholder="Confirm Password" minlength="8" class="form-control" required
                        name="confirmPassword" [(ngModel)]="myForm.confirmPassword"
                        #confirmPassword="ngModel" pattern="{{ password.value }}"
                        id="confirmPassword" />
                    <div class="input-group-append">
                        <span class="input-group-text cursor-pointer">
                            <i class="feather font-small-4" [ngClass]="{
                            'icon-eye': passwordTextTypeRetype,
                            'icon-eye-off': !passwordTextTypeRetype
                            }" (click)="togglePasswordTextTypeRetype()"></i>
                        </span>
                    </div>
                </div>
                <div *ngIf="confirmPassword.invalid && confirmPassword.touched"
                    class="form-text text-danger small">
                    <small *ngIf="['confirmPassword.errors.required']">
                        Confirm password is required.
                    </small>
                    <small *ngIf="['confirmPassword.errors.pattern']">
                        Password & Confirm Password does not match.</small>
                </div>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary mr-1 mt-1" 
            [disabled]="!f.form.valid" rippleEffect (click)="onChangePassword(f.form.valid)">{{loading?'Please wait
                ...':'Submit'}}</button>
            <!-- <button type="reset" class="btn btn-outline-secondary mt-1" rippleEffect>Cancel</button> -->
        </div>
    </div>

</form>
