<div class="content-body">
    <section id="multiple-validation">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title w-100">Edit Role
                            <!-- <a href="#" routerLink='/role-management/list' routerLinkActive="router-link-active" type="button"
                                class="btn btn-primary float-right">Back</a> -->
                        </h4>
                    </div>
                    <div class="card-body">
                        <form class="forms-sample" (ngSubmit)="f.form.valid" #f="ngForm" novalidate>
                            <div class="form-group row">
                                <label for="exampleInputName1" class="col-sm-2 col-form-label">Name</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control" id="exampleInputName1"
                                        placeholder="Enter Name" pattern="[a-zA-Z0-9 ]*" name="name"
                                        [(ngModel)]="roleForm.name" #name="ngModel"
                                        [ngClass]="{ 'is-invalid': f.submitted && name.invalid && showError }"
                                        minlength="2" maxlength="60" required>
                                    <span class="validation_error form-text text-danger small"
                                        *ngIf="name.invalid && showError">
                                        <span class="validation_error form-text text-danger"
                                            *ngIf="name.errors?.['required']">Name is
                                            required</span>
                                        <span class="validation_error form-text text-danger"
                                            *ngIf="name.errors?.['minlength']">
                                            Please enter name between 2 and 60.
                                        </span>
                                        <span class="validation_error form-text text-danger"
                                            *ngIf="name.errors?.['pattern']">
                                            Please enter valid name.
                                        </span>
                                    </span>
                                </div>
                            </div>
                            <div class="form-group row">
                                <div class="col-12">
                                    <div class="table-responsive border rounded mt-1">
                                        <h6 class="py-1 mx-1 mb-0 font-medium-2">
                                            <i class="fa fa-lock mr-25"></i>
                                            <span class="align-middle">Permission</span>
                                        </h6>
                                        <table class="table table-striped table-borderless">
                                            <thead class="thead-light">
                                                <tr>
                                                    <th>Module Name</th>
                                                    <th>Select All</th>
                                                    <th>List</th>
                                                    <th>Add</th>
                                                    <th>Edit</th>
                                                    <th>View</th>
                                                    <th>Delete</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr *ngFor="let item of resource; let i=index;">
                                                    <td>{{item?.moduleName}}</td>
                                                    <td>
                                                        <div class="custom-control custom-checkbox">
                                                            <!-- <label class="form-check-label"> -->
                                                            <input type="checkbox" class="custom-control-input"
                                                                [(ngModel)]="item.selectedAll"
                                                                [ngModelOptions]="{standalone: true}"
                                                                id="selectall-customCheck-{{i}}"
                                                                (change)="selectAllList(i)">
                                                            <!-- <i class="input-helper"></i> -->
                                                            <!-- </label> -->
                                                            <label class="custom-control-label"
                                                                for="selectall-customCheck-{{i}}"></label>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="custom-control custom-checkbox">
                                                            <!-- <label class="form-check-label"> -->
                                                            <input type="checkbox" name="list"
                                                                [(ngModel)]="item.list"
                                                                (change)="checkIfAllValues(i)"
                                                                [ngModelOptions]="{standalone: true}"
                                                                id="list-customCheck-{{i}}"
                                                                class="custom-control-input">
                                                            <!-- <i class="input-helper"></i> -->
                                                            <!-- </label> -->
                                                            <label class="custom-control-label"
                                                                for="list-customCheck-{{i}}"></label>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="custom-control custom-checkbox">
                                                            <!-- <label class="form-check-label"> -->
                                                            <input type="checkbox" name="add"
                                                                class="custom-control-input"
                                                                (change)="checkIfAllValues(i)"
                                                                [ngModelOptions]="{standalone: true}"
                                                                id="add-customCheck-{{i}}" [(ngModel)]="item.add">
                                                            <!-- <i class="input-helper"></i> -->
                                                            <!-- </label> -->
                                                            <label class="custom-control-label"
                                                                for="add-customCheck-{{i}}"></label>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="custom-control custom-checkbox">
                                                            <!-- <label class="form-check-label"> -->
                                                            <input type="checkbox" name="edit"
                                                                class="custom-control-input"
                                                                (change)="checkIfAllValues(i)"
                                                                [ngModelOptions]="{standalone: true}"
                                                                id="edit-customCheck-{{i}}" [(ngModel)]="item.edit">
                                                            <!-- <i class="input-helper"></i> -->
                                                            <!-- </label> -->
                                                            <label class="custom-control-label"
                                                                for="edit-customCheck-{{i}}"></label>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="custom-control custom-checkbox">
                                                            <!-- <label class="form-check-label"> -->
                                                            <input type="checkbox" name="view"
                                                                class="custom-control-input"
                                                                (change)="checkIfAllValues(i)"
                                                                [ngModelOptions]="{standalone: true}"
                                                                id="view-customCheck-{{i}}" [(ngModel)]="item.view">
                                                            <!-- <i class="input-helper"></i> -->
                                                            <!-- </label> -->
                                                            <label class="custom-control-label"
                                                                for="view-customCheck-{{i}}"></label>
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div class="custom-control custom-checkbox">
                                                            <!-- <label class="form-check-label"> -->
                                                            <input type="checkbox" name="delete"
                                                                class="custom-control-input"
                                                                (change)="checkIfAllValues(i)"
                                                                [ngModelOptions]="{standalone: true}"
                                                                [(ngModel)]="item.delete"
                                                                id="delete-customCheck-{{i}}">
                                                            <!-- <i class="input-helper"></i> -->
                                                            <!-- </label> -->
                                                            <label class="custom-control-label"
                                                                for="delete-customCheck-{{i}}"></label>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                           <div class="text-center">
                            <button type="submit" class="btn btn-primary mr-2" *ngIf="checkpermission(1,'edit')" 
                            (click)="onSubmit(f.form.valid)">{{loading?'Please wait ...':'Submit'}}</button>
                        <button class="btn btn-danger" [routerLink]="['/role-management/list']"
                            routerLinkActive="router-link-active">Cancel</button>
                           </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
