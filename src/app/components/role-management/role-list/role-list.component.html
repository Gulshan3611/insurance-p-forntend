<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">
                        <input type="text" class="form-control d-inline-block col-md-4" id="exampleInputEmail1"

                        <button type="button" routerLink="/role-management/add" routerLinkActive="router-link-active"
                            class="btn btn-primary ml-1 float-right" rippleEffect>Add New Role</button>
                    </h4>
                    <div class="table-responsive mb-2">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>S.No</th>
                                    <th>Name</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- <tr *ngFor="let item of roleList.docs let i=index"> -->
                                <tr>
                                    <td>1</td>
                                    <td> Manage Staff</td>
                                    <td>
                                        <label class="badge badge-success">Active</label>
                                    </td>

                                    <td class="overflow-hidden">
                                        <div container="body" ngbDropdown placement="bottom-right" class="d-inline-block">
                                            <button type="button"
                                                class="btn btn-flat-primary waves-effect waves-light"
                                                id="dropdownBasic2" ngbDropdownToggle>
                                                <i class="feather icon-more-vertical"></i>
                                            </button>
                                            <div ngbDropdownMenu aria-labelledby="dropdownBasic2">
                                                <a ngbDropdownItem href="javascript:void(0);" routerLink="/role-management/view/343434"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-eye mr-50"></i><span>View</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);" routerLink="/role-management/edit/343434"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-edit mr-50"></i><span>Edit</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);">
                                                    <i class="feather icon-toggle-right mr-50"></i><span>Activate</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);">
                                                    <i class="feather icon-toggle-left mr-50"></i> <span>Deactivate</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);">
                                                    <i class="feather icon-trash mr-50"></i> <span>Delete</span>
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td> Project Manager</td>
                                    <td>
                                        <label class="badge badge-success">Active</label>
                                    </td>

                                    <td class="overflow-hidden">
                                        <div container="body" ngbDropdown placement="bottom-right" class="d-inline-block">
                                            <button type="button"
                                                class="btn btn-flat-primary waves-effect waves-light"
                                                id="dropdownBasic2" ngbDropdownToggle>
                                                <i class="feather icon-more-vertical"></i>
                                            </button>
                                            <div ngbDropdownMenu aria-labelledby="dropdownBasic2">
                                                <a ngbDropdownItem href="javascript:void(0);" routerLink="/"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-eye mr-50"></i><span>View</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);" routerLink="/"
                                                    routerLinkActive="router-link-active">
                                                    <i class="feather icon-edit mr-50"></i><span>Edit</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);">
                                                    <i class="feather icon-toggle-right mr-50"></i><span>Activate</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);">
                                                    <i class="feather icon-toggle-left mr-50"></i> <span>Deactivate</span>
                                                </a>
                                                <a ngbDropdownItem href="javascript:void(0);">
                                                    <i class="feather icon-trash mr-50"></i> <span>Delete</span>
                                                </a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <!-- <tr *ngIf="roleListLength.length==0 && apiCalled">
                    <td class="noData text-center" colspan="10">No Records found</td>
                </tr> -->

                        </table>
                    </div>

            [(page)]="page" [maxSize]="10" [rotate]="true" [boundaryLinks]="true" (pageChange)="refreshList(page,'')">

            </div>
