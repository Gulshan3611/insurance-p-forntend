<div class="content-body">
    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="row flex-grow">
                <div class="col-12 stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Edit Gst
                                <!-- <a href="#" routerLink='/gst/list' routerLinkActive="router-link-active"
                                    type="button" class="btn btn-primary float-right">Back</a> -->
                            </h4>
                            <form class="forms-sample" (ngSubmit)="f.form.valid" #f="ngForm" novalidate>
                                <div class="form-group row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Industry Name*</label>
                                            <input type="text" class="form-control"
                                                pattern="[a-zA-Z0-9 ]*" name="industry"
                                                [(ngModel)]="gstForm.industry" #industry="ngModel" minlength="2"
                                                maxlength="60" required>
                                            <span class="form-text text-danger small" *ngIf="industry.invalid && showError">
                                                <span class="form-text text-danger small"
                                                    *ngIf="industry.errors?.['required']">Industry name is
                                                    required</span>
                                                <span class="form-text text-danger small"
                                                    [hidden]="!industry.errors?.['minlength']">
                                                    Please enter industry name between 2 and 60.
                                                </span>
                                                <span class="form-text text-danger small"
                                                    [hidden]="!industry.errors?.['pattern']">
                                                    Please enter valid industry name.
                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>GST (%)* </label>
                                            <input type="text" class="form-control"
                                            pattern="^[0-9]*$" name="gst"
                                                [(ngModel)]="gstForm.gst" #gst="ngModel"
                                                maxlength="3" required>
                                            <span class="form-text text-danger small" *ngIf="gst.invalid && showError">
                                                <span class="form-text text-danger" *ngIf="gst.errors?.['required']">GST is
                                                    required
                                                </span>
                                                <span class="form-text text-danger"
                                                    *ngIf="gst.errors?.['pattern']">Please enter in number.
                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <!-- <div class="col-md-4">
                                        <div class="form-group">
                                            <label>CGST (%)* </label>
                                            <input type="text" class="form-control"
                                            pattern="^[0-9]*$" name="cgst"
                                                [(ngModel)]="gstForm.cgst" #cgst="ngModel"
                                                maxlength="3" required>

                                                </span>

                                                </span>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="col-md-4">

                                            <label>SGST (%)* </label>

                                            pattern="^[0-9]*$" name="sgst"

                                                </span>
                                                <span class="form-text text-danger"

                                                </span>
                                            </span>
                                        </div>
                                    </div> -->
                                    
                                    <div class="col-md-12 text-center">
                                        <button type="submit" class="btn btn-primary mr-1 waves-effect waves-light" *ngIf="checkpermission(6,'edit')"
                                            (click)="onSubmit(f.form.valid)">{{loading?'Please wait ...':'Submit'}}</button>
                                        <a href="#" routerLink='/gst/list' routerLinkActive="router-link-active"
                                            class="btn btn-danger waves-effect waves-light">Cancel</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
